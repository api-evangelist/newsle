name: Newsle
description: >-
  Newsle was a news-alerting startup that used disambiguation, natural language
  processing, and machine-learning algorithms to find blog posts and articles
  mentioning people in a user's professional and social network, notifying them
  seconds after publication. Founded around 2011 and backed by Bloomberg Beta,
  it grew to more than two million users before being acquired by LinkedIn in
  July 2014, after which its team and features were folded into LinkedIn and the
  standalone product was retired. The newsle.com domain no longer resolves to a
  live site and the company exposes no public developer portal, documentation,
  or API surface today. This profile is retained in the API Evangelist network
  as a historical portfolio-company lead.
